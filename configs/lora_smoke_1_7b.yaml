# Fast end-to-end check (minutes): proves data, training, adapter loading and eval all work
# before committing to the long 4B run.
#   mlx_lm.lora --config configs/lora_smoke_1_7b.yaml
model: mlx-community/Qwen3-1.7B-4bit
train: true
data: data/mlx
fine_tune_type: lora
mask_prompt: true
num_layers: 8
batch_size: 2
grad_checkpoint: true
iters: 150
learning_rate: 1.0e-4
max_seq_length: 768
steps_per_report: 10
steps_per_eval: 50
val_batches: 10
save_every: 50
adapter_path: adapters/smoke
seed: 7
