[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scrubber"
version = "0.1.0"
description = "On-device PII redaction with a small open model fine-tuned on a laptop (MLX + Ollama)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "faker>=30",
  "datasets>=3.0",
  "ollama>=0.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
mlx = ["mlx-lm>=0.28"]            # Apple Silicon only
presidio = ["presidio-analyzer>=2.2"]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
scrubber = "scrubber.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scrubber"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]
